<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil Saya</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 400px;

            background: white;
            padding: 35px 25px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .profile-photo {
            width: 130px;
            height: 130px;

            object-fit: cover;

            border-radius: 50%;

            border: 5px solid #667eea;

            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #222;

            margin-bottom: 10px;
        }

        .identity {
            color: #777;
            margin-bottom: 30px;
        }

        h2 {
            text-align: left;
            font-size: 18px;

            margin-bottom: 15px;
        }

        .contact {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact a {
            display: block;

            padding: 13px;

            border-radius: 10px;

            background: #f1f3f5;

            color: #333;

            text-decoration: none;

            transition: 0.3s;
        }

        .contact a:hover {
            background: #667eea;
            color: white;

            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <!-- Foto profil -->
        <img
            src="foto gueh.jpeg"
            alt="Foto Profil"
            class="profile-photo"
        >

        <!-- Nama -->
        <h1>M Rasya Keizer Fatari</h1>

        <!-- Identitas -->
        <p class="identity">
            2557071004 | 19 | INTP
        </p>

</body>
</html>
